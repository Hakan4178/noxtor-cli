name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 6 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get remove -y libsodium-dev libsodium23 || true
        sudo apt-get install -y gcc-14 g++-14 make curl libsqlite3-dev libseccomp-dev

    # libsodium derlemesi pahalı. /usr/local root'a ait olduğu için doğrudan
    # önbelleklenemez; derleme ağacı önbelleklenir, kurulum her koşuda yapılır.
    - name: Cache libsodium build
      id: cache-libsodium
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /tmp/libsodium-1.0.22
        key: libsodium-1.0.22-adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349-${{ runner.os }}-${{ runner.arch }}

    - name: Build libsodium 1.0.22
      if: steps.cache-libsodium.outputs.cache-hit != 'true'
      run: |
        curl -fsSLo /tmp/libsodium-1.0.22.tar.gz https://download.libsodium.org/libsodium/releases/libsodium-1.0.22.tar.gz
        echo "adbdd8f16149e81ac6078a03aca6fc03b592b89ef7b5ed83841c086191be3349  /tmp/libsodium-1.0.22.tar.gz" | sha256sum -c -
        tar xzf /tmp/libsodium-1.0.22.tar.gz -C /tmp
        cd /tmp/libsodium-1.0.22
        ./configure --prefix=/usr/local
        make -j"$(nproc)"

    - name: Install libsodium 1.0.22
      run: |
        sudo make -C /tmp/libsodium-1.0.22 install
        sudo ldconfig
        grep -q crypto_hash_sha3256 /usr/local/include/sodium/crypto_hash_sha3.h

    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      env:
        LIBRARY_PATH: /usr/local/lib
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
      run: |
        make CC=gcc-14

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        category: "/language:${{matrix.language}}"
