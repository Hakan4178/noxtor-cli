name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '42 6 * * 2'

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: c-cpp
          build-mode: manual

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get remove -y libsodium-dev libsodium23 || true
        sudo apt-get install -y gcc-14 g++-14 make curl libsqlite3-dev libseccomp-dev

    - name: Build libsodium 1.0.22
      run: |
        curl -fsSLO https://download.libsodium.org/libsodium/releases/libsodium-1.0.22-stable.tar.gz
        echo "eb9873cc5ccd7b26ef058394264663c99e9c047b423be1ffd484071774198f26  libsodium-1.0.22-stable.tar.gz" | sha256sum -c -
        tar xzf libsodium-1.0.22-stable.tar.gz
        cd libsodium-stable
        ./configure --prefix=/usr/local
        make -j"$(nproc)"
        sudo make install
        sudo ldconfig
        grep -q crypto_hash_sha3256 /usr/local/include/sodium/crypto_hash_sha3256.h

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: security-extended,security-and-quality

    - name: Run manual build steps
      if: matrix.build-mode == 'manual'
      shell: bash
      env:
        LIBRARY_PATH: /usr/local/lib
        PKG_CONFIG_PATH: /usr/local/lib/pkgconfig
      run: |
        make CC=gcc-14

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"